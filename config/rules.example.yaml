# Example automation rules configuration
# Copy this to config/rules.yaml and customize

rules:
  # Rule 1: Pause campaigns with low CTR
  - name: "Pause Low CTR Campaigns"
    enabled: true
    entity_type: "campaign"
    entity_filter:
      status: "ACTIVE"
    all_conditions: true  # AND all conditions
    conditions:
      - metric: "ctr"
        operator: "<"
        value: 0.5
      - metric: "spend"
        operator: ">"
        value: 100
    actions:
      - action_type: "pause_campaign"
        parameters: {}
      - action_type: "send_alert"
        parameters:
          message: "Campaign paused due to low CTR"
    schedule: "0 9 * * *"  # Daily at 9 AM

  # Rule 2: Increase budget for high performers
  - name: "Scale High ROAS Campaigns"
    enabled: true
    entity_type: "campaign"
    entity_filter:
      status: "ACTIVE"
    all_conditions: true
    conditions:
      - metric: "roas"
        operator: ">="
        value: 3.0
      - metric: "spend"
        operator: ">="
        value: 200
    actions:
      - action_type: "increase_budget"
        parameters:
          percent: 20
      - action_type: "send_alert"
        parameters:
          message: "High performer - budget increased by 20%"
    schedule: "0 10 * * *"  # Daily at 10 AM

  # Rule 3: Reduce budget for low performers
  - name: "Reduce Budget for Low ROAS"
    enabled: true
    entity_type: "campaign"
    entity_filter:
      status: "ACTIVE"
    all_conditions: true
    conditions:
      - metric: "roas"
        operator: "<"
        value: 1.0
      - metric: "spend"
        operator: ">"
        value: 100
    actions:
      - action_type: "decrease_budget"
        parameters:
          percent: 30
    schedule: "0 10 * * *"  # Daily at 10 AM

  # Rule 4: Alert on high CPC
  - name: "Alert on High CPC"
    enabled: true
    entity_type: "campaign"
    entity_filter:
      status: "ACTIVE"
    all_conditions: true
    conditions:
      - metric: "cpc"
        operator: ">"
        value: 5.0
      - metric: "spend"
        operator: ">"
        value: 50
    actions:
      - action_type: "send_alert"
        parameters:
          message: "Campaign has high CPC - review bidding strategy"
    schedule: "0 */6 * * *"  # Every 6 hours

  # Rule 5: Pause campaigns with no conversions
  - name: "Pause Zero Conversion Campaigns"
    enabled: true
    entity_type: "campaign"
    entity_filter:
      status: "ACTIVE"
    all_conditions: true
    conditions:
      - metric: "conversions"
        operator: "=="
        value: 0
      - metric: "spend"
        operator: ">"
        value: 200
    actions:
      - action_type: "pause_campaign"
        parameters: {}
      - action_type: "send_alert"
        parameters:
          message: "Campaign paused - no conversions after $200 spend"
    schedule: "0 12 * * *"  # Daily at noon

  # Rule 6: Alert on budget overspend
  - name: "Budget Overspend Alert"
    enabled: true
    entity_type: "campaign"
    entity_filter:
      status: "ACTIVE"
    all_conditions: false  # OR any condition
    conditions:
      - metric: "spend"
        operator: ">"
        value: 1000
    actions:
      - action_type: "send_alert"
        parameters:
          message: "Campaign spending is high - review immediately"
    schedule: "0 */3 * * *"  # Every 3 hours
