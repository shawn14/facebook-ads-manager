{% extends "base.html" %}

{% block title %}Campaigns - Facebook Ads Manager{% endblock %}

{% block content %}
<div x-data="campaigns()" x-init="init()" class="py-6">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Header -->
        <div class="md:flex md:items-center md:justify-between mb-6">
            <div class="flex-1 min-w-0">
                <h1 class="text-2xl font-bold leading-7 text-gray-900 sm:text-3xl sm:truncate">
                    Campaigns
                </h1>
            </div>
            <div class="mt-4 flex md:mt-0 md:ml-4 space-x-3">
                <select x-model="statusFilter" @change="loadCampaigns()" class="rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                    <option value="">All Status</option>
                    <option value="ACTIVE">Active</option>
                    <option value="PAUSED">Paused</option>
                </select>
                <button @click="showCreateModal = true" class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">
                    <svg class="-ml-1 mr-2 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    Create Campaign
                </button>
            </div>
        </div>

        <!-- Campaigns Table -->
        <div class="bg-white shadow rounded-lg overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Campaign Name</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Objective</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Budget</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Performance</th>
                            <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <template x-for="campaign in campaigns" :key="campaign.id">
                            <tr>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="text-sm font-medium text-gray-900" x-text="campaign.name"></div>
                                    <div class="text-sm text-gray-500" x-text="'ID: ' + campaign.id"></div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                                          :class="campaign.status === 'ACTIVE' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'"
                                          x-text="campaign.status"></span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="campaign.objective"></td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                    <span x-text="campaign.daily_budget ? formatCurrency(campaign.daily_budget / 100) + '/day' : 'N/A'"></span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                    <template x-if="campaign.insights">
                                        <div>
                                            <div class="text-sm" x-text="'Spend: ' + formatCurrency(campaign.insights.spend || 0)"></div>
                                            <div class="text-sm" :class="(campaign.insights.roas || 0) >= 2 ? 'text-green-600' : 'text-red-600'" x-text="'ROAS: ' + (campaign.insights.roas || 0).toFixed(2) + 'x'"></div>
                                        </div>
                                    </template>
                                    <template x-if="!campaign.insights">
                                        <span class="text-gray-400">No data</span>
                                    </template>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                    <div class="flex justify-end space-x-2">
                                        <button @click="toggleStatus(campaign)" class="text-blue-600 hover:text-blue-900" :title="campaign.status === 'ACTIVE' ? 'Pause' : 'Activate'">
                                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path x-show="campaign.status === 'ACTIVE'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                                <path x-show="campaign.status === 'PAUSED'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                                                <path x-show="campaign.status === 'PAUSED'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                            </svg>
                                        </button>
                                        <button @click="editBudget(campaign)" class="text-green-600 hover:text-green-900" title="Edit Budget">
                                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                                            </svg>
                                        </button>
                                        <button @click="deleteCampaign(campaign)" class="text-red-600 hover:text-red-900" title="Delete">
                                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                            </svg>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Create Campaign Modal -->
        <div x-show="showCreateModal" x-cloak class="fixed z-10 inset-0 overflow-y-auto">
            <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
                <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" @click="showCreateModal = false"></div>
                <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                    <form @submit.prevent="createCampaign()">
                        <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                            <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">Create New Campaign</h3>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Campaign Name</label>
                                    <input type="text" x-model="newCampaign.name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Objective</label>
                                    <select x-model="newCampaign.objective" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                        <option value="LINK_CLICKS">Link Clicks</option>
                                        <option value="CONVERSIONS">Conversions</option>
                                        <option value="REACH">Reach</option>
                                        <option value="BRAND_AWARENESS">Brand Awareness</option>
                                        <option value="VIDEO_VIEWS">Video Views</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Daily Budget ($)</label>
                                    <input type="number" x-model="newCampaign.daily_budget" min="1" step="0.01" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Status</label>
                                    <select x-model="newCampaign.status" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                        <option value="PAUSED">Paused</option>
                                        <option value="ACTIVE">Active</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                            <button type="submit" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none sm:ml-3 sm:w-auto sm:text-sm">
                                Create
                            </button>
                            <button type="button" @click="showCreateModal = false" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Edit Budget Modal -->
        <div x-show="showBudgetModal" x-cloak class="fixed z-10 inset-0 overflow-y-auto">
            <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
                <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" @click="showBudgetModal = false"></div>
                <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                    <form @submit.prevent="updateBudget()">
                        <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                            <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">Update Campaign Budget</h3>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Daily Budget ($)</label>
                                <input type="number" x-model="budgetEdit.newBudget" min="1" step="0.01" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                            </div>
                        </div>
                        <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                            <button type="submit" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none sm:ml-3 sm:w-auto sm:text-sm">
                                Update
                            </button>
                            <button type="button" @click="showBudgetModal = false" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function campaigns() {
    return {
        campaigns: [],
        statusFilter: '',
        showCreateModal: false,
        showBudgetModal: false,
        newCampaign: {
            name: '',
            objective: 'LINK_CLICKS',
            daily_budget: 50,
            status: 'PAUSED'
        },
        budgetEdit: {
            campaignId: null,
            newBudget: 0
        },

        async init() {
            await this.loadCampaigns();
        },

        async loadCampaigns() {
            try {
                const params = new URLSearchParams({
                    include_insights: 'true'
                });
                if (this.statusFilter) {
                    params.append('status', this.statusFilter);
                }

                console.log('Fetching campaigns from /api/campaigns...');
                const response = await fetch(`/api/campaigns?${params}`);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                console.log('Campaigns loaded:', data);
                this.campaigns = data.campaigns || [];
                console.log('Campaign count:', this.campaigns.length);
            } catch (error) {
                console.error('Failed to load campaigns:', error);
                notify('Failed to load campaigns: ' + error.message, 'error');
            }
        },

        async createCampaign() {
            try {
                const params = new URLSearchParams({
                    name: this.newCampaign.name,
                    objective: this.newCampaign.objective,
                    daily_budget: this.newCampaign.daily_budget,
                    status: this.newCampaign.status
                });

                const response = await fetch(`/api/campaigns?${params}`, {
                    method: 'POST'
                });

                if (!response.ok) throw new Error('Failed to create campaign');

                notify('Campaign created successfully');
                this.showCreateModal = false;
                this.newCampaign = {
                    name: '',
                    objective: 'LINK_CLICKS',
                    daily_budget: 50,
                    status: 'PAUSED'
                };
                await this.loadCampaigns();
            } catch (error) {
                console.error('Failed to create campaign:', error);
                notify('Failed to create campaign', 'error');
            }
        },

        async toggleStatus(campaign) {
            const newStatus = campaign.status === 'ACTIVE' ? 'PAUSED' : 'ACTIVE';
            try {
                const response = await fetch(`/api/campaigns/${campaign.id}/status?status=${newStatus}`, {
                    method: 'PUT'
                });

                if (!response.ok) throw new Error('Failed to update status');

                notify(`Campaign ${newStatus.toLowerCase()}`);
                await this.loadCampaigns();
            } catch (error) {
                console.error('Failed to update status:', error);
                notify('Failed to update status', 'error');
            }
        },

        editBudget(campaign) {
            this.budgetEdit.campaignId = campaign.id;
            this.budgetEdit.newBudget = campaign.daily_budget ? campaign.daily_budget / 100 : 50;
            this.showBudgetModal = true;
        },

        async updateBudget() {
            try {
                const response = await fetch(`/api/campaigns/${this.budgetEdit.campaignId}/budget?budget=${this.budgetEdit.newBudget}`, {
                    method: 'PUT'
                });

                if (!response.ok) throw new Error('Failed to update budget');

                notify('Budget updated successfully');
                this.showBudgetModal = false;
                await this.loadCampaigns();
            } catch (error) {
                console.error('Failed to update budget:', error);
                notify('Failed to update budget', 'error');
            }
        },

        async deleteCampaign(campaign) {
            if (!confirm(`Are you sure you want to delete "${campaign.name}"?`)) {
                return;
            }

            try {
                const response = await fetch(`/api/campaigns/${campaign.id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Failed to delete campaign');

                notify('Campaign deleted successfully');
                await this.loadCampaigns();
            } catch (error) {
                console.error('Failed to delete campaign:', error);
                notify('Failed to delete campaign', 'error');
            }
        },

        formatCurrency(value) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD'
            }).format(value);
        }
    };
}
</script>
{% endblock %}
